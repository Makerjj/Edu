<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分镜字幕工作台</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #171717;
      --secondary: #4d4d4d;
      --tertiary: #006bff;
      --background-100: #ffffff;
      --background-200: #fafafa;
      --gray-100: #f2f2f2;
      --gray-200: #ebebeb;
      --gray-300: #e6e6e6;
      --gray-400: #eaeaea;
      --gray-700: #8f8f8f;
      --gray-900: #4d4d4d;
      --gray-1000: #171717;
      --gray-alpha-100: #0000000d;
      --gray-alpha-200: #00000015;
      --gray-alpha-300: #0000001a;
      --gray-alpha-400: #00000014;
      --gray-alpha-500: #00000036;
      --blue-100: #f0f7ff;
      --blue-200: #e9f4ff;
      --blue-700: #006bff;
      --blue-1000: #002359;
      --green-100: #ecfdec;
      --green-700: #28a948;
      --green-1000: #003a00;
      --amber-100: #fff6de;
      --amber-700: #ffae00;
      --amber-1000: #561900;
      --red-100: #ffeeef;
      --red-700: #fc0035;
      --red-1000: #47000c;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-full: 9999px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      font-family: "Geist Sans", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--background-100);
      color: var(--gray-1000);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background-100);
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 2px var(--background-100), 0 0 0 4px var(--blue-700);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .workspace-shell {
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(420px, 1fr) minmax(260px, 320px);
      min-height: 100vh;
      background: var(--background-100);
    }

    .shot-rail,
    .review-rail {
      background: var(--background-200);
      border-color: var(--gray-alpha-400);
      overflow-y: auto;
      padding: var(--space-6);
    }

    .shot-rail {
      border-right: 1px solid var(--gray-alpha-400);
    }

    .review-rail {
      border-left: 1px solid var(--gray-alpha-400);
    }

    .script-panel {
      min-width: 0;
      overflow-y: auto;
      padding: var(--space-8);
    }

    .eyebrow {
      color: var(--gray-900);
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      margin-bottom: var(--space-2);
    }

    .workspace-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 32px;
      margin-bottom: var(--space-2);
    }

    .workspace-meta {
      color: var(--gray-900);
      font-size: 13px;
      line-height: 20px;
      margin-bottom: var(--space-6);
    }

    .scene-group {
      margin-bottom: var(--space-6);
    }

    .scene-label {
      align-items: center;
      color: var(--gray-900);
      display: flex;
      font-size: 12px;
      font-weight: 500;
      justify-content: space-between;
      line-height: 16px;
      margin-bottom: var(--space-2);
      text-transform: uppercase;
    }

    .scene-count {
      color: var(--gray-700);
      font-variant-numeric: tabular-nums;
      text-transform: none;
    }

    .shot-list {
      display: grid;
      gap: var(--space-2);
    }

    .shot-card {
      background: var(--background-100);
      border: 1px solid var(--gray-alpha-400);
      border-radius: var(--radius-sm);
      color: inherit;
      cursor: pointer;
      min-height: 76px;
      padding: var(--space-3);
      text-align: left;
      width: 100%;
    }

    .shot-card:hover {
      border-color: var(--gray-alpha-500);
      background: var(--gray-alpha-100);
    }

    .shot-card.active {
      background: var(--blue-100);
      border-color: var(--blue-700);
    }

    .shot-card-id {
      color: var(--blue-700);
      display: block;
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 16px;
      margin-bottom: var(--space-1);
    }

    .shot-card-title {
      display: block;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      margin-bottom: var(--space-1);
    }

    .shot-card-meta {
      color: var(--gray-900);
      display: flex;
      font-size: 12px;
      gap: var(--space-2);
      line-height: 16px;
    }

    .detail-header {
      align-items: start;
      border-bottom: 1px solid var(--gray-alpha-400);
      display: flex;
      gap: var(--space-6);
      justify-content: space-between;
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-6);
    }

    .detail-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 32px;
      margin-bottom: var(--space-2);
    }

    .detail-meta {
      color: var(--gray-900);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 20px;
    }

    .status-pill {
      align-items: center;
      border: 1px solid var(--gray-alpha-400);
      border-radius: var(--radius-full);
      color: var(--gray-1000);
      display: inline-flex;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      padding: 5px 10px;
      white-space: nowrap;
    }

    .panel {
      background: var(--background-100);
      border: 1px solid var(--gray-alpha-400);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
      padding: var(--space-6);
    }

    .panel-title {
      align-items: center;
      color: var(--gray-900);
      display: flex;
      font-size: 13px;
      font-weight: 500;
      justify-content: space-between;
      line-height: 20px;
      margin: 0 0 var(--space-3);
    }

    .panel-body {
      color: var(--gray-1000);
      font-size: 14px;
      line-height: 22px;
      margin: 0;
      white-space: pre-wrap;
    }

    .subtitle-panel {
      border-color: var(--blue-700);
      background: var(--blue-100);
    }

    .subtitle-panel .panel-body {
      color: var(--blue-1000);
      font-size: 18px;
      font-weight: 600;
      line-height: 28px;
    }

    .metadata-stack {
      display: grid;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }

    .metadata-row {
      align-items: start;
      border-bottom: 1px solid var(--gray-alpha-200);
      display: grid;
      gap: var(--space-2);
      grid-template-columns: 76px 1fr;
      padding-bottom: var(--space-3);
    }

    .metadata-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .metadata-label {
      color: var(--gray-900);
      font-size: 12px;
      line-height: 16px;
    }

    .metadata-value {
      color: var(--gray-1000);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 20px;
      overflow-wrap: anywhere;
    }

    .field-status {
      display: grid;
      gap: var(--space-2);
      margin: 0 0 var(--space-6);
      padding: 0;
    }

    .field-status li,
    .checks li {
      list-style: none;
    }

    .status-item {
      align-items: center;
      display: flex;
      font-size: 13px;
      gap: var(--space-2);
      line-height: 20px;
    }

    .status-dot {
      border-radius: var(--radius-full);
      flex: 0 0 8px;
      height: 8px;
      width: 8px;
    }

    .status-ok {
      background: var(--green-700);
    }

    .status-missing {
      background: var(--red-700);
    }

    .checks {
      display: grid;
      gap: var(--space-2);
      margin: 0;
      padding: 0;
    }

    .checks li {
      background: var(--background-100);
      border: 1px solid var(--gray-alpha-400);
      border-radius: var(--radius-sm);
      color: var(--gray-1000);
      font-size: 13px;
      line-height: 20px;
      padding: var(--space-2) var(--space-3);
    }

    .empty-state,
    .error-state {
      border: 1px solid var(--gray-alpha-400);
      border-radius: var(--radius-md);
      padding: var(--space-6);
    }

    .error-state {
      background: var(--red-100);
      border-color: var(--red-700);
      color: var(--red-1000);
    }

    .error-state ul {
      margin-bottom: 0;
      padding-left: var(--space-6);
    }

    @media (max-width: 1100px) {
      .workspace-shell {
        grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
      }

      .review-rail {
        border-left: 0;
        border-top: 1px solid var(--gray-alpha-400);
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      .workspace-shell {
        display: block;
      }

      .shot-rail {
        border-right: 0;
        border-bottom: 1px solid var(--gray-alpha-400);
        max-height: 46vh;
      }

      .script-panel,
      .shot-rail,
      .review-rail {
        padding: var(--space-4);
      }

      .detail-header {
        display: block;
      }

      .status-pill {
        margin-top: var(--space-3);
      }
    }
  </style>
</head>
<body>
  <div class="workspace-shell">
    <aside class="shot-rail" aria-label="分镜导航">
      <div class="eyebrow">Storyboard</div>
      <h1 class="workspace-title" id="title">分镜字幕工作台</h1>
      <p class="workspace-meta" id="summary">读取 storyboard.json 中...</p>
      <nav id="shotList" aria-label="分镜列表"></nav>
    </aside>

    <main class="script-panel" id="detail" aria-live="polite">
      <div class="empty-state">正在读取分镜。</div>
    </main>

    <aside class="review-rail" aria-label="分镜检查">
      <div class="eyebrow">Review</div>
      <h2 class="workspace-title">检查面板</h2>
      <div id="review"></div>
    </aside>
  </div>

  <script>
    const requiredFields = ["id", "scene", "title", "visual", "narration", "subtitle"];
    const shotList = document.querySelector("#shotList");
    const detail = document.querySelector("#detail");
    const review = document.querySelector("#review");
    const title = document.querySelector("#title");
    const summary = document.querySelector("#summary");
    let shots = [];
    let activeIndex = 0;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function validateStoryboard(data) {
      if (!data || !Array.isArray(data.shots) || data.shots.length === 0) {
        return ["storyboard.json 需要包含非空 shots 数组"];
      }
      const seen = new Set();
      const findings = [];
      data.shots.forEach((shot, index) => {
        const shotId = shot && shot.id ? shot.id : `#${index + 1}`;
        if (!shot || typeof shot !== "object") {
          findings.push(`第 ${index + 1} 条分镜必须是对象`);
          return;
        }
        if (seen.has(shotId)) {
          findings.push(`分镜 ${shotId} 重复`);
        }
        seen.add(shotId);
        requiredFields.forEach((field) => {
          if (typeof shot[field] !== "string" || shot[field].trim() === "") {
            findings.push(`分镜 ${shotId} 缺少 ${field}`);
          }
        });
      });
      return findings;
    }

    function groupShotsByScene() {
      return shots.reduce((groups, shot, index) => {
        const scene = shot.scene || "unknown";
        if (!groups.has(scene)) {
          groups.set(scene, []);
        }
        groups.get(scene).push({shot, index});
        return groups;
      }, new Map());
    }

    function selectShot(index) {
      activeIndex = index;
      render();
    }

    function renderShotList() {
      const groups = groupShotsByScene();
      shotList.innerHTML = Array.from(groups.entries()).map(([scene, items]) => `
        <section class="scene-group" aria-label="${escapeHtml(scene)}">
          <div class="scene-label">
            <span>${escapeHtml(scene)}</span>
            <span class="scene-count">${items.length} shots</span>
          </div>
          <div class="shot-list">
            ${items.map(({shot, index}) => `
              <button class="shot-card ${index === activeIndex ? "active" : ""}" type="button" data-index="${index}">
                <span class="shot-card-id">${escapeHtml(shot.id)}</span>
                <span class="shot-card-title">${escapeHtml(shot.title)}</span>
                <span class="shot-card-meta">
                  <span>${escapeHtml(shot.durationHint || "?")} 秒</span>
                  <span>${escapeHtml((shot.subtitle || "").length)} 字幕字数</span>
                </span>
              </button>
            `).join("")}
          </div>
        </section>
      `).join("");

      shotList.querySelectorAll("button.shot-card").forEach((button) => {
        button.addEventListener("click", () => selectShot(Number(button.dataset.index)));
      });
    }

    function renderDetail(shot) {
      detail.innerHTML = `
        <div class="detail-header">
          <div>
            <h2 class="detail-title">${escapeHtml(shot.title)}</h2>
            <div class="detail-meta">${escapeHtml(shot.id)} · ${escapeHtml(shot.scene)}</div>
          </div>
          <span class="status-pill">${escapeHtml(shot.durationHint || "?")} 秒</span>
        </div>

        <section class="panel subtitle-panel">
          <h3 class="panel-title">字幕文本 <span>${escapeHtml((shot.subtitle || "").length)} 字</span></h3>
          <p class="panel-body">${escapeHtml(shot.subtitle)}</p>
        </section>

        <section class="panel">
          <h3 class="panel-title">旁白脚本</h3>
          <p class="panel-body">${escapeHtml(shot.narration)}</p>
        </section>

        <section class="panel">
          <h3 class="panel-title">画面说明</h3>
          <p class="panel-body">${escapeHtml(shot.visual)}</p>
        </section>
      `;
    }

    function renderReview(shot) {
      const checks = Array.isArray(shot.checks) ? shot.checks : [];
      review.innerHTML = `
        <div class="metadata-stack">
          <div class="metadata-row">
            <span class="metadata-label">分镜</span>
            <span class="metadata-value">${escapeHtml(shot.id)}</span>
          </div>
          <div class="metadata-row">
            <span class="metadata-label">场景</span>
            <span class="metadata-value">${escapeHtml(shot.scene)}</span>
          </div>
          <div class="metadata-row">
            <span class="metadata-label">预计</span>
            <span class="metadata-value">${escapeHtml(shot.durationHint || "?")} 秒</span>
          </div>
        </div>

        <h3 class="panel-title">字段状态</h3>
        <ul class="field-status">
          ${requiredFields.map((field) => {
            const ok = typeof shot[field] === "string" && shot[field].trim() !== "";
            return `
              <li class="status-item">
                <span class="status-dot ${ok ? "status-ok" : "status-missing"}"></span>
                <span>${escapeHtml(field)}：${ok ? "已填写" : "缺失"}</span>
              </li>
            `;
          }).join("")}
        </ul>

        <h3 class="panel-title">检查点</h3>
        <ul class="checks">
          ${checks.map((item) => `<li>${escapeHtml(item)}</li>`).join("") || "<li>未设置检查点</li>"}
        </ul>
      `;
    }

    function render() {
      if (!shots.length) {
        detail.innerHTML = '<div class="empty-state">没有可显示的分镜。</div>';
        review.innerHTML = "";
        return;
      }
      const shot = shots[activeIndex];
      renderShotList();
      renderDetail(shot);
      renderReview(shot);
    }

    function showError(message, findings = []) {
      summary.textContent = "读取失败";
      detail.innerHTML = `
        <div class="error-state">
          <strong>${escapeHtml(message)}</strong>
          ${findings.length ? `<ul>${findings.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}
        </div>
      `;
      review.innerHTML = "";
    }

    fetch("storyboard.json", {cache: "no-store"})
      .then((response) => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        const findings = validateStoryboard(data);
        if (findings.length) {
          showError("storyboard.json 校验失败", findings);
          return;
        }
        title.textContent = data.title || "分镜字幕工作台";
        shots = data.shots;
        summary.textContent = `${shots.length} 个分镜 · ${groupShotsByScene().size} 个场景`;
        render();
      })
      .catch((error) => {
        showError(`无法读取 storyboard.json：${error.message}`);
      });
  </script>
</body>
</html>
