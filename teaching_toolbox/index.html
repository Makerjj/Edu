<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教学工具箱</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-auth-state="checking">
    <section class="login-screen" id="loginScreen" hidden aria-hidden="true">
      <form class="login-panel" id="loginForm">
        <div class="brand login-brand">
          <div class="brand-mark">教</div>
          <div>
            <h1>教学工具箱</h1>
            <p>请输入你在 OJ/code.xdf.cn 使用的手机号和密码</p>
          </div>
        </div>
        <label>
          手机号
          <input name="account" autocomplete="username" placeholder="OJ 手机号" />
        </label>
        <label>
          密码
          <input name="password" type="password" autocomplete="current-password" placeholder="OJ 密码" />
        </label>
        <label class="remember-row">
          <input name="remember" type="checkbox" checked />
          <span>记住登录状态</span>
        </label>
        <div class="login-actions">
          <button id="loginBtn" class="primary-button" type="submit">登录</button>
          <button id="cancelLoginBtn" class="ghost-button" type="button">先不登录</button>
        </div>
        <div class="status-banner" id="loginStatus" hidden></div>
      </form>
    </section>

    <div class="app-shell" id="appShell">
      <aside class="sidebar" aria-label="工具导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">T</div>
          <div>
            <h1>教学工具箱</h1>
            <p>Teaching workspace</p>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-button" data-tool="profile" type="button">学情反馈表</button>
          <button class="nav-button active" data-tool="feedback" type="button">课后反馈</button>
        </nav>
        <p class="sidebar-footer">本地教学工作流</p>
      </aside>

      <div
        class="sidebar-resize-handle"
        id="sidebarResizeHandle"
        role="separator"
        aria-label="调整侧边栏宽度"
        aria-orientation="vertical"
        tabindex="0"
      ></div>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="workspace-context">今日教学工作台</p>
            <h2 id="toolTitle">课后反馈</h2>
          </div>
          <div class="actions">
            <span class="save-state" id="saveState" role="status">本地工作区</span>
            <button id="themeToggleBtn" class="theme-toggle-button" type="button" aria-label="切换到深色模式" aria-pressed="false">
              <span class="theme-toggle-icon" aria-hidden="true">◐</span>
              <span id="themeToggleText">深色</span>
            </button>
            <div class="user-menu" id="userMenu" hidden>
              <button class="user-menu-button" id="userMenuBtn" type="button" aria-haspopup="menu" aria-expanded="false">
                <span id="currentUser"></span>
                <span class="user-menu-caret" aria-hidden="true">⌄</span>
              </button>
              <div class="user-menu-list" id="userMenuList" role="menu" hidden>
                <button id="logoutBtn" type="button" role="menuitem">退出登录</button>
              </div>
            </div>
            <button id="openLoginBtn" class="ghost-button" type="button" hidden>登录 OJ</button>
            <button id="generateReportBtn" class="primary-button" type="button" title="生成学情表" hidden>生成学情表</button>
          </div>
        </header>

        <section class="tool-view" id="profileTool" data-tool-view="profile">
          <div class="status-banner" id="reportStatus" hidden></div>
          <section class="report-result" id="reportResult" aria-labelledby="reportResultTitle" hidden>
            <div class="report-result-toolbar">
              <h3 id="reportResultTitle"></h3>
              <div class="report-result-actions">
                <button id="exitReportBtn" class="mini-button" type="button" title="退出学情表，返回选择">退出学情表</button>
                <button id="adjustReportBtn" class="mini-button" type="button">调整选择</button>
                <button id="copyReportBtn" class="mini-button" type="button">复制表格</button>
                <button id="downloadReportBtn" class="primary-button" type="button">下载 Excel</button>
              </div>
            </div>
            <div class="report-table-scroll" tabindex="0" role="region" aria-label="学情表">
              <table class="report-table" id="reportTable"></table>
            </div>
          </section>
          <form class="input-panel" id="profileForm">
            <h3 class="form-section-title">班级与训练</h3>
            <div class="form-grid">
              <label data-field="reportType">
                表格类型
                <select name="reportType" id="reportTypeSelect">
                  <option value="standard">常规学情反馈表</option>
                  <option value="homework">课后作业完成情况</option>
                </select>
              </label>
              <label data-field="team">
                团队 / 班级
                <select name="team" id="teamSelect">
                  <option value="">加载团队中...</option>
                </select>
              </label>
              <label data-field="training">
                训练名称
                <select name="training" id="trainingSelect" disabled>
                  <option value="">请先选择团队</option>
                </select>
              </label>
              <label>
                训练密码
                <input name="trainingPassword" placeholder="私有训练需要填写" />
              </label>
            </div>
            <input type="hidden" name="teamName" id="teamNameInput" />
            <input type="hidden" name="teamId" id="teamIdInput" />
            <input type="hidden" name="trainingTitle" id="trainingTitleInput" />
            <input type="hidden" name="trainingId" id="trainingIdInput" />
            <input type="hidden" name="problems" id="problemsInput" />
            <input type="hidden" name="afterClassProblems" id="afterProblemsInput" />
            <input type="hidden" name="studentsJson" id="studentsJsonInput" />
            <h3 class="form-section-title">学生名单</h3>
            <label data-field="students">
              学生名单
              <div class="problem-toolbar">
                <span id="studentStatus">请选择团队后加载学生</span>
                <button id="retryStudentsBtn" class="mini-button" type="button" hidden>重新加载</button>
                <button id="selectAllStudentsBtn" class="mini-button" type="button">全选</button>
                <button id="clearStudentsBtn" class="mini-button" type="button">清空</button>
              </div>
              <div class="student-list" id="studentList" aria-live="polite"></div>
              <div class="student-save-row">
                <input id="studentsFilenameInput" type="hidden" value="students.json" />
                <input id="studentsJsonUploadInput" type="file" accept=".json,application/json" hidden />
                <button id="uploadStudentsJsonBtn" class="mini-button" type="button">上传 JSON</button>
                <button id="saveStudentsBtn" class="mini-button" type="button">保存学生名单</button>
              </div>
              <div class="helper-text" id="savedStudentsStatus">保存后，下次选择该团队会自动使用这份名单</div>
            </label>
            <h3 class="form-section-title">题目范围</h3>
            <label data-field="problems" id="classProblemField">
              课堂题目
              <div class="problem-toolbar">
                <span id="problemStatus">请选择训练后加载题目</span>
                <button id="retryProblemsBtn" class="mini-button" type="button" hidden>重新加载</button>
                <button id="selectAllProblemsBtn" class="mini-button" type="button">全选</button>
                <button id="clearProblemsBtn" class="mini-button" type="button">清空</button>
              </div>
              <div class="checkbox-list" id="problemList" aria-live="polite"></div>
            </label>
            <label id="afterProblemField">
              课后题目
              <div class="problem-toolbar">
                <span id="afterProblemStatus">请选择训练后加载课后题</span>
                <button id="retryAfterProblemsBtn" class="mini-button" type="button" hidden>重新加载</button>
                <button id="selectAllAfterProblemsBtn" class="mini-button" type="button">全选</button>
                <button id="clearAfterProblemsBtn" class="mini-button" type="button">清空</button>
              </div>
              <div class="checkbox-list" id="afterProblemList" aria-live="polite"></div>
            </label>
          </form>
        </section>

        <section class="tool-view active" id="feedbackTool" data-tool-view="feedback">
          <form class="input-panel" id="feedbackForm">
            <h3 class="form-section-title">课堂信息</h3>
            <div class="form-grid">
              <label>
                课堂内容主题（独立，可选）
                <input name="topic" placeholder="例如：数组与循环综合练习" />
              </label>
              <label>
                默认表现
                <select name="level">
                  <option value="优秀">优秀</option>
                  <option value="中等" selected>中等</option>
                  <option value="差">差</option>
                </select>
              </label>
            </div>
            <label>
              课堂内容反馈（独立，可选）
              <div class="knowledge-toolbar">
                <button id="compressKnowledgeBtn" class="mini-button" type="button">压缩知识点</button>
              </div>
              <div class="knowledge-input-shell" id="feedbackKnowledgeShell">
                <div class="knowledge-image-preview" id="feedbackScreenshotPreview" hidden>
                  <div class="knowledge-image-frame">
                    <img id="feedbackScreenshotImage" alt="课堂截图预览" />
                    <button id="removeFeedbackScreenshotBtn" class="remove-image-button" type="button" aria-label="删除课堂截图" title="删除课堂截图">×</button>
                  </div>
                </div>
                <textarea name="knowledgePoints" rows="3" placeholder="用于整理统一的课堂内容，不会自动写入学生私人反馈"></textarea>
              </div>
            </label>
            <div class="problem-toolbar">
              <span id="feedbackOcrStatus">截图仅用于整理课堂内容，可不上传；学生私人反馈根据下方表现和细节单独生成</span>
              <input id="feedbackScreenshotInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
              <button id="uploadFeedbackScreenshotBtn" class="mini-button" type="button">选择课堂截图</button>
              <button id="confirmFeedbackScreenshotBtn" class="mini-button" type="button" disabled>确认上传给 Codex 总结</button>
            </div>
            <textarea id="feedbackAgentSummary" class="agent-summary-preview" rows="5" readonly hidden></textarea>
            <h3 class="form-section-title">学生表现</h3>
            <div class="problem-toolbar">
              <span id="feedbackStatus">请上传学生 JSON 后生成反馈</span>
              <input id="feedbackJsonUploadInput" type="file" accept=".json,application/json" hidden />
              <button id="uploadFeedbackJsonBtn" class="mini-button" type="button">上传学生 JSON</button>
            </div>
            <h3 class="form-section-title">生成与复核</h3>
            <div class="feedback-list" id="feedbackList" aria-live="polite"></div>
          </form>
        </section>

      </main>
    </div>

    <script src="./feedback_builder.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
